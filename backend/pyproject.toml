[project]
name = "timesheet-platform-backend"
version = "1.0.0"
description = "Timesheet & Workforce Management Platform backend (Django + DRF)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["B008", "B904", "DJ001"]
