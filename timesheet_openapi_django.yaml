openapi: 3.1.0
info:
  title: Timesheet & Workforce Management API
  version: 1.0.0
  description: >-
    Production-ready API contract for the Timesheet & Workforce Management Platform MVP.
    Implemented with Python, Django, Django REST Framework (DRF), and drf-spectacular.
    All timestamps are RFC 3339 UTC; work dates are local calendar dates (YYYY-MM-DD).
    Durations are integer minutes.
servers:
  - url: https://{host}/api/v1
    description: Environment base URL
    variables:
      host:
        default: timesheet.example.com
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Identity
  - name: Users
  - name: Settings
  - name: Clients
  - name: Projects
  - name: Assignments
  - name: Timesheets
  - name: Approvals
  - name: Reports
  - name: Dashboard
  - name: Notifications
  - name: Audit
paths:
  /health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        default:
          $ref: '#/components/responses/StandardError'
  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness probe including database connectivity
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          $ref: '#/components/responses/StandardError'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate with email and password
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '429':
          $ref: '#/components/responses/HTTP429'
        default:
          $ref: '#/components/responses/StandardError'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: Access token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        default:
          $ref: '#/components/responses/StandardError'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout current session
      operationId: authLogout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/HTTP401'
        default:
          $ref: '#/components/responses/StandardError'
  /auth/me:
    get:
      tags:
        - Identity
      summary: Get current user and effective permissions
      operationId: getCurrentUser
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          description: Standard error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AUTH_INVALID_TOKEN:
                  value:
                    error:
                      code: AUTH_INVALID_TOKEN
                      message: Authentication credentials were not provided or are invalid.
                      request_id: req_example
  /users:
    get:
      tags:
        - Users
      summary: List users within caller scope
      operationId: listUsers
      parameters:
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ActiveStatus'
        - name: department
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Paged users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsers'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          $ref: '#/components/responses/StandardError'
    post:
      tags:
        - Users
      summary: Create a user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          description: Standard error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AUTH_FORBIDDEN:
                  value:
                    error:
                      code: AUTH_FORBIDDEN
                      message: Auth forbidden
                      request_id: req_example
                USER_EMAIL_EXISTS:
                  value:
                    error:
                      code: USER_EMAIL_EXISTS
                      message: User email exists
                      request_id: req_example
  /users/{user_id}:
    get:
      tags:
        - Users
      summary: Get user
      operationId: getUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          $ref: '#/components/responses/StandardError'
    patch:
      tags:
        - Users
      summary: Update user
      operationId: updateUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          $ref: '#/components/responses/StandardError'
  /settings:
    get:
      tags:
        - Settings
      summary: Retrieve company-wide timesheet configuration
      operationId: getCompanySettings
      responses:
        '200':
          description: Company settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySettings'
        '401':
          $ref: '#/components/responses/HTTP401'
        default:
          $ref: '#/components/responses/StandardError'
    patch:
      tags:
        - Settings
      summary: Update company-wide timesheet configuration
      operationId: updateCompanySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanySettingsUpdate'
      responses:
        '200':
          description: Company settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySettings'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        default:
          $ref: '#/components/responses/StandardError'
  /clients:
    get:
      tags:
        - Clients
      summary: List clients
      operationId: listClients
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ActiveStatus'
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Paged client list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedClients'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          $ref: '#/components/responses/StandardError'
    post:
      tags:
        - Clients
      summary: Create client
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
      responses:
        '201':
          description: Client created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          description: Standard error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AUTH_FORBIDDEN:
                  value:
                    error:
                      code: AUTH_FORBIDDEN
                      message: Auth forbidden
                      request_id: req_example
                CLIENT_CODE_EXISTS:
                  value:
                    error:
                      code: CLIENT_CODE_EXISTS
                      message: Client code exists
                      request_id: req_example
  /clients/{client_id}:
    patch:
      tags:
        - Clients
      summary: Update client
      operationId: updateClient
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdate'
      responses:
        '200':
          description: Client updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        default:
          $ref: '#/components/responses/StandardError'
  /projects:
    get:
      tags:
        - Projects
      summary: List projects visible to caller
      operationId: listProjects
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ProjectStatus'
        - name: client_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Paged projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProjects'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          $ref: '#/components/responses/StandardError'
    post:
      tags:
        - Projects
      summary: Create project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          description: Standard error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AUTH_FORBIDDEN:
                  value:
                    error:
                      code: AUTH_FORBIDDEN
                      message: Auth forbidden
                      request_id: req_example
                PROJECT_CODE_EXISTS:
                  value:
                    error:
                      code: PROJECT_CODE_EXISTS
                      message: Project code exists
                      request_id: req_example
  /projects/{project_id}:
    get:
      tags:
        - Projects
      summary: Get project detail
      operationId: getProject
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          $ref: '#/components/responses/StandardError'
    patch:
      tags:
        - Projects
      summary: Update project
      operationId: updateProject
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          $ref: '#/components/responses/StandardError'
  /projects/{project_id}/tasks:
    get:
      tags:
        - Projects
      summary: List project tasks
      operationId: listProjectTasks
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ActiveStatus'
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          $ref: '#/components/responses/StandardError'
    post:
      tags:
        - Projects
      summary: Create project task
      operationId: createProjectTask
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          $ref: '#/components/responses/StandardError'
  /projects/{project_id}/tasks/{task_id}:
    patch:
      tags:
        - Projects
      summary: Update project task
      operationId: updateProjectTask
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        default:
          $ref: '#/components/responses/StandardError'
  /assignments:
    get:
      tags:
        - Assignments
      summary: List project assignments
      operationId: listAssignments
      parameters:
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: active_on
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Paged assignment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAssignments'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          $ref: '#/components/responses/StandardError'
    post:
      tags:
        - Assignments
      summary: Create project assignment
      operationId: createAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreate'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '409':
          $ref: '#/components/responses/HTTP409'
        '422':
          $ref: '#/components/responses/HTTP422'
        '429':
          $ref: '#/components/responses/HTTP429'
        '500':
          $ref: '#/components/responses/HTTP500'
        '503':
          $ref: '#/components/responses/HTTP503'
        default:
          description: Standard error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AUTH_FORBIDDEN:
                  value:
                    error:
                      code: AUTH_FORBIDDEN
                      message: Auth forbidden
                      request_id: req_example
                ASSIGNMENT_DATE_INVALID:
                  value:
                    error:
                      code: ASSIGNMENT_DATE_INVALID
                      message: Assignment date invalid
                      request_id: req_example
  /assignments/{assignment_id}:
